<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">

        <div class="image">
            <img class="background-image" src="./images/fern.jpg" alt="background image">
            <div class="logo">
                <img class="odin-logo" src="./images/odin-lined.jpg" alt="logo-image">
                <p class="odin">ODIN</p>
           </div>
           <p class="credit"> Photo by <a href="https://unsplash.com/@halie_west">
                              Halie West</a>on <a href="https://unsplash.com">Unsplash</a></p>
        </div>

        <div class="form">
            <div class="header">
                <p>This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up now to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div class="signup-form">
                <h2>Let's do this!</h2>
                <form id="signup-form" action="index.html" method="post">
                    <div class="field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="field">
                        <label for="phone-number">Phone Number</label>
                        <input type="tel" id="phone-number" name="phone-number" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </form> 
            </div>
                    <div class="footer">
                    <button type="submit" form="signup-form">Sign Up</button>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </div>
        </div>

            
    </div>
    
</body>
</html>
